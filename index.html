<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-tools</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1>web-tools</h1>
    <p>簡易アプリ集です。下のリストから各アプリを開けます。</p>
  </header>

  <div id="app-grid" class="app-grid"></div>
  <p id="empty-state" class="empty-state" hidden>アプリがまだ登録されていません。</p>

  <footer class="page-footer">
    <p>新しいアプリの追加方法は <a href="README.md">README.md</a> を参照してください。</p>
  </footer>
</div>

<script>
  fetch('apps.json')
    .then((res) => res.json())
    .then((apps) => {
      const grid = document.getElementById('app-grid');
      const empty = document.getElementById('empty-state');
      if (!apps.length) {
        empty.hidden = false;
        return;
      }
      for (const app of apps) {
        const a = document.createElement('a');
        a.className = 'app-card';
        a.href = app.path;
        const h2 = document.createElement('h2');
        h2.textContent = app.name;
        const p = document.createElement('p');
        p.textContent = app.description || '';
        a.append(h2, p);
        grid.appendChild(a);
      }
    })
    .catch((err) => {
      console.error('Failed to load apps.json', err);
      document.getElementById('empty-state').hidden = false;
    });
</script>
</body>
</html>
