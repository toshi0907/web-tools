<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像一括リサイズ - web-tools</title>
<link rel="stylesheet" href="../../assets/style.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3457d5">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<style>
  .field {
    margin-bottom: 1rem;
  }
  .field label {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  input[type="file"] {
    width: 100%;
    color: var(--fg);
  }
  input[type="number"] {
    width: 100%;
    max-width: 160px;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--fg);
    font-size: 1rem;
  }
  .size-fields {
    display: flex;
    align-items: flex-end;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .size-fields .field {
    margin-bottom: 0;
  }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
  }
  .checkbox-field label {
    color: var(--fg);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .file-info {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0.5rem 0 1.5rem;
  }
  .file-list {
    list-style: none;
    padding: 0;
    margin: 0 0 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 260px;
    overflow-y: auto;
  }
  .file-list li {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
  }
  .file-list img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .file-list .file-name {
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-list .file-dims {
    margin-left: auto;
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .actions {
    margin-top: 1.5rem;
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
  }
  button.primary {
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button.primary:hover {
    opacity: 0.9;
  }
  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    margin-top: 1rem;
    font-size: 0.9rem;
  }
  .status.error {
    color: #c0392b;
  }
  .status.info {
    color: var(--muted);
  }
  .status.success {
    color: #2e7d32;
  }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="../../index.html">&larr; アプリ一覧に戻る</a>
  <header class="page-header">
    <h1>画像一括リサイズ</h1>
    <p>複数の画像をアップロードして、指定したピクセル数に一括リサイズし、ZIPにまとめてダウンロードできます。</p>
  </header>

  <div class="field">
    <label for="file-input">画像ファイル（複数選択可）</label>
    <input id="file-input" type="file" accept="image/*" multiple>
  </div>
  <p class="file-info" id="file-info">ファイルが選択されていません。</p>
  <ul class="file-list" id="file-list"></ul>

  <div class="size-fields">
    <div class="field">
      <label for="width-input">幅（px）</label>
      <input id="width-input" type="number" min="1" step="1" value="800">
    </div>
    <div class="field">
      <label for="height-input">高さ（px）</label>
      <input id="height-input" type="number" min="1" step="1" value="600">
    </div>
  </div>
  <div class="checkbox-field">
    <input id="keep-aspect" type="checkbox" checked>
    <label for="keep-aspect">縦横比を固定する（指定サイズの枠に収まるよう拡大縮小し、画像が歪まないようにします）</label>
  </div>

  <div class="actions">
    <button class="primary" id="resize-btn" disabled>リサイズしてZIPを作成</button>
    <button class="primary" id="download-btn" hidden>ZIPをダウンロード</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<script>
  const fileInput = document.getElementById('file-input');
  const fileInfo = document.getElementById('file-info');
  const fileListEl = document.getElementById('file-list');
  const widthInput = document.getElementById('width-input');
  const heightInput = document.getElementById('height-input');
  const keepAspectInput = document.getElementById('keep-aspect');
  const resizeBtn = document.getElementById('resize-btn');
  const downloadBtn = document.getElementById('download-btn');
  const statusEl = document.getElementById('status');

  let entries = [];
  let pendingZip = null;

  function setStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  function formatBytes(bytes) {
    if (bytes < 1024) {
      return `${bytes} B`;
    }
    const kb = bytes / 1024;
    if (kb < 1024) {
      return `${kb.toFixed(1)} KB`;
    }
    return `${(kb / 1024).toFixed(2)} MB`;
  }

  function clearPendingZip() {
    if (pendingZip) {
      URL.revokeObjectURL(pendingZip.url);
      pendingZip = null;
    }
    downloadBtn.hidden = true;
  }

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        if (img.naturalWidth === 0 || img.naturalHeight === 0) {
          URL.revokeObjectURL(url);
          reject(new Error(`${file.name} の画像サイズを取得できませんでした。`));
          return;
        }
        resolve({ img, url });
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error(`${file.name} を画像として読み込めませんでした。`));
      };
      img.src = url;
    });
  }

  function renderFileList() {
    fileListEl.innerHTML = '';
    for (const entry of entries) {
      const li = document.createElement('li');

      const thumb = document.createElement('img');
      thumb.src = entry.url;
      thumb.alt = '';
      li.appendChild(thumb);

      const name = document.createElement('span');
      name.className = 'file-name';
      name.textContent = entry.file.name;
      li.appendChild(name);

      const dims = document.createElement('span');
      dims.className = 'file-dims';
      dims.textContent = `${entry.img.naturalWidth}×${entry.img.naturalHeight}`;
      li.appendChild(dims);

      fileListEl.appendChild(li);
    }
  }

  fileInput.addEventListener('change', async () => {
    for (const entry of entries) {
      URL.revokeObjectURL(entry.url);
    }
    entries = [];
    fileListEl.innerHTML = '';
    resizeBtn.disabled = true;
    clearPendingZip();
    setStatus('', '');

    const files = Array.from(fileInput.files || []);
    if (files.length === 0) {
      fileInfo.textContent = 'ファイルが選択されていません。';
      return;
    }

    const imageFiles = files.filter((f) => f.type.startsWith('image/'));
    if (imageFiles.length === 0) {
      fileInfo.textContent = '画像ファイルが選択されていません。';
      setStatus('画像ファイルを選択してください。', 'error');
      return;
    }

    fileInfo.textContent = '画像を読み込んでいます…';

    const failedNames = [];
    for (const file of imageFiles) {
      try {
        const { img, url } = await loadImage(file);
        entries.push({ file, img, url });
      } catch (err) {
        failedNames.push(file.name);
      }
    }

    const skipped = files.length - imageFiles.length;
    const notes = [];
    if (skipped > 0) {
      notes.push(`画像以外の ${skipped} 個のファイルはスキップしました`);
    }
    if (failedNames.length > 0) {
      notes.push(`${failedNames.length} 個の画像の読み込みに失敗しました（${failedNames.join(', ')}）`);
    }
    fileInfo.textContent = `${entries.length} 個の画像を読み込みました${notes.length > 0 ? `（${notes.join('。')}）` : ''}。`;
    if (failedNames.length > 0) {
      setStatus(`一部の画像を読み込めませんでした: ${failedNames.join(', ')}`, 'error');
    }
    renderFileList();
    resizeBtn.disabled = entries.length === 0;
  });

  function computeSize(origW, origH, targetW, targetH, keepAspect) {
    if (!keepAspect) {
      return { w: targetW, h: targetH };
    }
    const scale = Math.min(targetW / origW, targetH / origH);
    return {
      w: Math.max(1, Math.round(origW * scale)),
      h: Math.max(1, Math.round(origH * scale)),
    };
  }

  function outputMime(file) {
    const type = file.type;
    if (type === 'image/jpeg' || type === 'image/png' || type === 'image/webp') {
      return type;
    }
    return 'image/png';
  }

  function extForMime(mime) {
    if (mime === 'image/jpeg') return '.jpg';
    if (mime === 'image/webp') return '.webp';
    return '.png';
  }

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function formatTimestamp(date) {
    return `${date.getFullYear()}${pad2(date.getMonth() + 1)}${pad2(date.getDate())}_${pad2(date.getHours())}${pad2(date.getMinutes())}${pad2(date.getSeconds())}`;
  }

  function findExifTiffOffset(view) {
    if (view.byteLength < 4 || view.getUint16(0, false) !== 0xffd8) {
      return null;
    }
    let offset = 2;
    while (offset + 4 <= view.byteLength) {
      const marker = view.getUint16(offset, false);
      if ((marker & 0xff00) !== 0xff00) {
        break;
      }
      if (marker === 0xffd8 || marker === 0xffd9 || marker === 0xff01 || (marker >= 0xffd0 && marker <= 0xffd7)) {
        offset += 2;
        continue;
      }
      const segmentLength = view.getUint16(offset + 2, false);
      if (marker === 0xffe1) {
        const exifHeaderOffset = offset + 4;
        if (
          exifHeaderOffset + 6 <= view.byteLength &&
          view.getUint32(exifHeaderOffset, false) === 0x45786966 &&
          view.getUint16(exifHeaderOffset + 4, false) === 0x0000
        ) {
          return exifHeaderOffset + 6;
        }
      }
      if (marker === 0xffda) {
        break;
      }
      offset += 2 + segmentLength;
    }
    return null;
  }

  function readIfdEntries(view, ifdOffset, little) {
    const count = view.getUint16(ifdOffset, little);
    const entries = [];
    for (let i = 0; i < count; i++) {
      const entryOffset = ifdOffset + 2 + i * 12;
      entries.push({
        tag: view.getUint16(entryOffset, little),
        type: view.getUint16(entryOffset + 2, little),
        count: view.getUint32(entryOffset + 4, little),
        valueFieldOffset: entryOffset + 8,
      });
    }
    return entries;
  }

  const EXIF_TYPE_SIZES = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };

  function readEntryAscii(view, entry, tiffStart, little) {
    const size = (EXIF_TYPE_SIZES[entry.type] || 1) * entry.count;
    const dataOffset = size <= 4 ? entry.valueFieldOffset : tiffStart + view.getUint32(entry.valueFieldOffset, little);
    const bytes = new Uint8Array(view.buffer, view.byteOffset + dataOffset, entry.count);
    return String.fromCharCode(...bytes).replace(/\0+$/, '');
  }

  function extractExifDateTimeOriginal(buffer) {
    try {
      const view = new DataView(buffer);
      const tiffStart = findExifTiffOffset(view);
      if (tiffStart === null) {
        return null;
      }

      const byteOrderMark = view.getUint16(tiffStart, false);
      const little = byteOrderMark === 0x4949;
      if (!little && byteOrderMark !== 0x4d4d) {
        return null;
      }

      const firstIfdOffset = view.getUint32(tiffStart + 4, little);
      const ifd0Entries = readIfdEntries(view, tiffStart + firstIfdOffset, little);
      const exifPointerEntry = ifd0Entries.find((e) => e.tag === 0x8769);
      if (!exifPointerEntry) {
        return null;
      }

      const exifIfdOffset = tiffStart + view.getUint32(exifPointerEntry.valueFieldOffset, little);
      const exifEntries = readIfdEntries(view, exifIfdOffset, little);
      const dateEntry = exifEntries.find((e) => e.tag === 0x9003 && e.type === 2);
      if (!dateEntry) {
        return null;
      }

      const str = readEntryAscii(view, dateEntry, tiffStart, little);
      const m = str.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
      if (!m) {
        return null;
      }
      const [, y, mo, d, hh, mi, ss] = m;
      if (Number(y) === 0 || Number(mo) === 0 || Number(d) === 0) {
        return null;
      }
      return new Date(Number(y), Number(mo) - 1, Number(d), Number(hh), Number(mi), Number(ss));
    } catch {
      return null;
    }
  }

  const EXIF_HEAD_READ_BYTES = 128 * 1024;

  async function getExifDateTimeOriginal(file) {
    try {
      const buffer = await file.slice(0, EXIF_HEAD_READ_BYTES).arrayBuffer();
      return extractExifDateTimeOriginal(buffer);
    } catch {
      return null;
    }
  }

  function canvasToBlob(canvas, mime) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (blob) {
          resolve(blob);
        } else {
          reject(new Error('画像の変換に失敗しました。'));
        }
      }, mime, mime === 'image/jpeg' ? 0.92 : undefined);
    });
  }

  resizeBtn.addEventListener('click', async () => {
    if (entries.length === 0) {
      return;
    }

    const targetW = Number(widthInput.value);
    const targetH = Number(heightInput.value);
    if (!Number.isInteger(targetW) || targetW < 1 || !Number.isInteger(targetH) || targetH < 1) {
      setStatus('幅・高さは1以上の整数で指定してください。', 'error');
      return;
    }

    resizeBtn.disabled = true;
    clearPendingZip();
    const keepAspect = keepAspectInput.checked;

    try {
      const zip = new JSZip();
      const usedNames = new Set();
      const fallbackTimestamp = formatTimestamp(new Date());
      let fallbackCounter = 0;

      for (let i = 0; i < entries.length; i++) {
        const { file, img } = entries[i];
        setStatus(`リサイズしています…（${i + 1}/${entries.length}）`, 'info');

        if (img.naturalWidth === 0 || img.naturalHeight === 0) {
          throw new Error(`${file.name} の画像サイズが不正なためリサイズできませんでした。`);
        }

        const size = computeSize(img.naturalWidth, img.naturalHeight, targetW, targetH, keepAspect);
        const canvas = document.createElement('canvas');
        canvas.width = size.w;
        canvas.height = size.h;
        const ctx = canvas.getContext('2d');
        if (!ctx) {
          throw new Error('Canvas の描画コンテキストを取得できませんでした。');
        }
        ctx.drawImage(img, 0, 0, size.w, size.h);

        const mime = outputMime(file);
        const blob = await canvasToBlob(canvas, mime);
        const ext = extForMime(mime);

        const exifDate = await getExifDateTimeOriginal(file);
        let baseNameForOutput;
        if (exifDate) {
          baseNameForOutput = formatTimestamp(exifDate);
        } else {
          fallbackCounter++;
          baseNameForOutput = `${fallbackTimestamp}-${fallbackCounter}`;
        }

        let name = `${baseNameForOutput}${ext}`;
        let counter = 2;
        while (usedNames.has(name)) {
          name = `${baseNameForOutput}_${counter}${ext}`;
          counter++;
        }
        usedNames.add(name);

        zip.file(name, blob);
      }

      setStatus('ZIPを生成しています…', 'info');
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      pendingZip = { blob: zipBlob, url: URL.createObjectURL(zipBlob) };
      downloadBtn.hidden = false;

      setStatus(`完了しました（${entries.length} 個の画像をリサイズしました。ZIPサイズ: ${formatBytes(zipBlob.size)}）。「ZIPをダウンロード」ボタンを押してください。`, 'success');
    } catch (err) {
      setStatus(err.message || 'リサイズ中にエラーが発生しました。', 'error');
    } finally {
      resizeBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!pendingZip) {
      return;
    }
    const link = document.createElement('a');
    link.download = 'resized_images.zip';
    link.href = pendingZip.url;
    link.click();
  });
</script>
</body>
</html>
