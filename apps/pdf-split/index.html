<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF分割ツール - web-tools</title>
<link rel="stylesheet" href="../../assets/style.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3457d5">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<style>
  .field {
    margin-bottom: 1rem;
  }
  .field label {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  input[type="file"] {
    width: 100%;
    color: var(--fg);
  }
  input[type="text"],
  input[type="number"] {
    width: 100%;
    max-width: 320px;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--fg);
    font-size: 1rem;
  }
  .file-info {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0.5rem 0 1.5rem;
  }
  .mode-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }
  .mode-option {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
  }
  .mode-option.selected {
    border-color: var(--accent);
  }
  .mode-option .mode-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-weight: 600;
  }
  .mode-option .mode-desc {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0;
  }
  .mode-option .mode-input {
    display: none;
  }
  .mode-option.selected .mode-input {
    display: block;
  }
  .actions {
    margin-top: 1.5rem;
  }
  button.primary {
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button.primary:hover {
    opacity: 0.9;
  }
  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    margin-top: 1rem;
    font-size: 0.9rem;
  }
  .status.error {
    color: #c0392b;
  }
  .status.info {
    color: var(--muted);
  }
  .status.success {
    color: #2e7d32;
  }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="../../index.html">&larr; アプリ一覧に戻る</a>
  <header class="page-header">
    <h1>PDF分割ツール</h1>
    <p>PDFをアップロードして、1ページずつ・指定範囲・最大ページ数のいずれかの方法で分割し、ZIPでまとめてダウンロードできます。</p>
  </header>

  <div class="field">
    <label for="file-input">PDFファイル</label>
    <input id="file-input" type="file" accept="application/pdf,.pdf">
  </div>
  <p class="file-info" id="file-info">ファイルが選択されていません。</p>

  <div class="mode-list" id="mode-list">
    <div class="mode-option selected" data-mode="single">
      <label class="mode-label"><input type="radio" name="mode" value="single" checked> 1ページずつ分割</label>
      <p class="mode-desc">すべてのページを1ページ1ファイルのPDFに分割します。</p>
    </div>
    <div class="mode-option" data-mode="range">
      <label class="mode-label"><input type="radio" name="mode" value="range"> ページ範囲を指定して分割</label>
      <p class="mode-desc">カンマ区切りで範囲を指定します（例: 1-3,4-10,11）。範囲ごとに1つのPDFになります。</p>
      <input class="mode-input" id="range-input" type="text" placeholder="例: 1-3,4-10,11">
    </div>
    <div class="mode-option" data-mode="chunk">
      <label class="mode-label"><input type="radio" name="mode" value="chunk"> 最大ページ数で分割</label>
      <p class="mode-desc">先頭から指定したページ数以下になるよう連続したまとまりに分割します。</p>
      <input class="mode-input" id="chunk-input" type="number" min="1" step="1" placeholder="例: 10">
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="split-btn" disabled>分割してZIPダウンロード</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<script>
  const fileInput = document.getElementById('file-input');
  const fileInfo = document.getElementById('file-info');
  const modeList = document.getElementById('mode-list');
  const rangeInput = document.getElementById('range-input');
  const chunkInput = document.getElementById('chunk-input');
  const splitBtn = document.getElementById('split-btn');
  const statusEl = document.getElementById('status');

  let currentFile = null;
  let currentBytes = null;
  let pageCount = 0;

  function setStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  function getMode() {
    const checked = modeList.querySelector('input[name="mode"]:checked');
    return checked ? checked.value : 'single';
  }

  modeList.addEventListener('change', () => {
    const mode = getMode();
    for (const option of modeList.querySelectorAll('.mode-option')) {
      option.classList.toggle('selected', option.dataset.mode === mode);
    }
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    currentFile = null;
    currentBytes = null;
    pageCount = 0;
    splitBtn.disabled = true;
    setStatus('', '');

    if (!file) {
      fileInfo.textContent = 'ファイルが選択されていません。';
      return;
    }

    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      fileInfo.textContent = `${file.name}（PDFファイルではありません）`;
      setStatus('PDFファイルを選択してください。', 'error');
      return;
    }

    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const doc = await PDFLib.PDFDocument.load(bytes);
      pageCount = doc.getPageCount();
      currentFile = file;
      currentBytes = bytes;
      fileInfo.textContent = `${file.name}（全 ${pageCount} ページ）`;
      splitBtn.disabled = false;
    } catch (err) {
      fileInfo.textContent = `${file.name}（読み込みに失敗しました）`;
      setStatus('PDFの読み込みに失敗しました。破損しているか、非対応の形式（暗号化など）の可能性があります。', 'error');
    }
  });

  function parseRanges(input, total) {
    const parts = input.split(',').map((s) => s.trim()).filter((s) => s.length > 0);
    if (parts.length === 0) {
      throw new Error('ページ範囲を入力してください。');
    }
    const groups = [];
    for (const part of parts) {
      const match = part.match(/^(\d+)(?:-(\d+))?$/);
      if (!match) {
        throw new Error(`範囲の形式が正しくありません: "${part}"`);
      }
      const start = parseInt(match[1], 10);
      const end = match[2] !== undefined ? parseInt(match[2], 10) : start;
      if (start < 1 || end < 1 || start > total || end > total || start > end) {
        throw new Error(`ページ範囲が不正です: "${part}"（1〜${total} の範囲で指定してください）`);
      }
      const indices = [];
      for (let p = start; p <= end; p++) {
        indices.push(p - 1);
      }
      groups.push({ indices, label: start === end ? `${start}` : `${start}-${end}` });
    }
    return groups;
  }

  function buildGroups(mode, total) {
    if (mode === 'single') {
      const groups = [];
      for (let i = 0; i < total; i++) {
        groups.push({ indices: [i], label: `${i + 1}` });
      }
      return groups;
    }

    if (mode === 'range') {
      return parseRanges(rangeInput.value, total);
    }

    if (mode === 'chunk') {
      const max = Number(chunkInput.value);
      if (!Number.isInteger(max) || max < 1) {
        throw new Error('最大ページ数は1以上の整数で指定してください。');
      }
      const groups = [];
      for (let start = 0; start < total; start += max) {
        const end = Math.min(start + max, total);
        const indices = [];
        for (let i = start; i < end; i++) {
          indices.push(i);
        }
        groups.push({ indices, label: end - start === 1 ? `${start + 1}` : `${start + 1}-${end}` });
      }
      return groups;
    }

    throw new Error('不明な分割方法です。');
  }

  function baseName(fileName) {
    const withoutExt = fileName.replace(/\.pdf$/i, '');
    return withoutExt || 'split';
  }

  splitBtn.addEventListener('click', async () => {
    if (!currentBytes || pageCount === 0) {
      return;
    }

    splitBtn.disabled = true;
    setStatus('分割しています…', 'info');

    try {
      const mode = getMode();
      const groups = buildGroups(mode, pageCount);

      const srcDoc = await PDFLib.PDFDocument.load(currentBytes);
      const zip = new JSZip();
      const name = baseName(currentFile.name);

      for (let i = 0; i < groups.length; i++) {
        const group = groups[i];
        const outDoc = await PDFLib.PDFDocument.create();
        const copiedPages = await outDoc.copyPages(srcDoc, group.indices);
        for (const page of copiedPages) {
          outDoc.addPage(page);
        }
        const outBytes = await outDoc.save();
        zip.file(`${name}_${group.label}.pdf`, outBytes);
      }

      setStatus('ZIPを生成しています…', 'info');
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const link = document.createElement('a');
      link.download = `${name}_split.zip`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);

      setStatus(`完了しました（${groups.length} 個のPDFファイルをZIPにまとめました）。`, 'success');
    } catch (err) {
      setStatus(err.message || '分割中にエラーが発生しました。', 'error');
    } finally {
      splitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
