<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>favicon作成ツール - web-tools</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    align-items: flex-start;
  }
  .controls {
    flex: 1 1 280px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .field label {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .field input[type="text"],
  .field select {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--fg);
    font-size: 1rem;
  }
  .color-row {
    display: flex;
    gap: 1rem;
  }
  .color-row .field {
    flex: 1;
  }
  .field input[type="color"] {
    width: 100%;
    height: 2.4rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
  }
  .preview {
    flex: 1 1 240px;
    min-width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .preview canvas {
    width: 160px;
    height: 160px;
    border: 1px solid var(--border);
    border-radius: 10px;
    image-rendering: pixelated;
  }
  .preview-tab {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    font-size: 0.85rem;
    color: var(--muted);
  }
  .preview-tab img {
    width: 16px;
    height: 16px;
  }
  .downloads {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
  }
  .downloads button {
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--fg);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .downloads button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  section.block {
    margin-top: 2rem;
  }
  section.block h2 {
    font-size: 1.1rem;
    margin-bottom: 0.8rem;
  }
</style>
</head>
<body>
<div class="page">
  <a class="back-link" href="../../index.html">&larr; アプリ一覧に戻る</a>
  <header class="page-header">
    <h1>favicon作成ツール</h1>
    <p>文字を入力するだけで、シンプルなfaviconを作成してダウンロードできます。</p>
  </header>

  <div class="layout">
    <div class="controls">
      <div class="field">
        <label for="text-input">文字（1〜3文字程度）</label>
        <input id="text-input" type="text" maxlength="4" value="W">
      </div>

      <div class="color-row">
        <div class="field">
          <label for="bg-color">背景色</label>
          <input id="bg-color" type="color" value="#3457d5">
        </div>
        <div class="field">
          <label for="text-color">文字色</label>
          <input id="text-color" type="color" value="#ffffff">
        </div>
      </div>

      <div class="field">
        <label for="shape-select">形</label>
        <select id="shape-select">
          <option value="square">四角</option>
          <option value="rounded" selected>角丸四角</option>
          <option value="circle">円</option>
        </select>
      </div>

      <div class="field">
        <label for="font-select">フォント</label>
        <select id="font-select">
          <option value="sans-serif" selected>ゴシック体</option>
          <option value="serif">明朝体</option>
          <option value="monospace">等幅</option>
        </select>
      </div>
    </div>

    <div class="preview">
      <canvas id="preview-canvas" width="256" height="256"></canvas>
      <div class="preview-tab">
        <img id="tab-preview-img" alt="favicon プレビュー">
        <span>ブラウザタブ表示イメージ</span>
      </div>
    </div>
  </div>

  <section class="block">
    <h2>ダウンロード</h2>
    <div class="downloads" id="download-buttons"></div>
  </section>

  <footer class="page-footer">
    <p>生成したPNGを favicon.png / apple-touch-icon.png としてサイトに設置してください。</p>
  </footer>
</div>

<script>
  const textInput = document.getElementById('text-input');
  const bgColorInput = document.getElementById('bg-color');
  const textColorInput = document.getElementById('text-color');
  const shapeSelect = document.getElementById('shape-select');
  const fontSelect = document.getElementById('font-select');
  const previewCanvas = document.getElementById('preview-canvas');
  const tabPreviewImg = document.getElementById('tab-preview-img');
  const downloadButtons = document.getElementById('download-buttons');
  const faviconLink = document.getElementById('favicon-link');

  const sizes = [16, 32, 48, 64, 128, 180, 512];

  function drawFavicon(canvas) {
    const size = canvas.width;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);

    const shape = shapeSelect.value;
    const bg = bgColorInput.value;
    ctx.fillStyle = bg;
    ctx.beginPath();
    if (shape === 'circle') {
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    } else if (shape === 'rounded') {
      const r = size * 0.2;
      ctx.moveTo(r, 0);
      ctx.arcTo(size, 0, size, size, r);
      ctx.arcTo(size, size, 0, size, r);
      ctx.arcTo(0, size, 0, 0, r);
      ctx.arcTo(0, 0, size, 0, r);
    } else {
      ctx.rect(0, 0, size, size);
    }
    ctx.closePath();
    ctx.fill();

    const text = (textInput.value || '').trim().slice(0, 4) || 'W';
    ctx.fillStyle = textColorInput.value;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let fontSize = size * 0.6;
    const maxWidth = size * 0.8;
    const fontFamily = fontSelect.value;
    do {
      ctx.font = `bold ${fontSize}px ${fontFamily}`;
      const width = ctx.measureText(text).width;
      if (width <= maxWidth) break;
      fontSize -= size * 0.02;
    } while (fontSize > size * 0.1);

    ctx.fillText(text, size / 2, size / 2 + size * 0.03);
  }

  function updatePreview() {
    drawFavicon(previewCanvas);
    tabPreviewImg.src = previewCanvas.toDataURL('image/png');
    updateSiteFavicon();
  }

  function updateSiteFavicon() {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    drawFavicon(canvas);
    let link = document.querySelector('link[rel="icon"]');
    if (!link) {
      link = document.createElement('link');
      link.rel = 'icon';
      document.head.appendChild(link);
    }
    link.href = canvas.toDataURL('image/png');
  }

  function downloadSize(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    drawFavicon(canvas);
    const link = document.createElement('a');
    link.download = `favicon-${size}x${size}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  for (const size of sizes) {
    const btn = document.createElement('button');
    btn.textContent = `${size}x${size} PNG`;
    btn.addEventListener('click', () => downloadSize(size));
    downloadButtons.appendChild(btn);
  }

  for (const el of [textInput, bgColorInput, textColorInput, shapeSelect, fontSelect]) {
    el.addEventListener('input', updatePreview);
  }

  updatePreview();
</script>
</body>
</html>
